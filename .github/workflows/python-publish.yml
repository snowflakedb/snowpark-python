# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3.1.4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Install protoc
      shell: bash
      run: .github/scripts/install_protoc.sh
    - name: Install tox
      run: python -m pip install tox
    - name: Build protobuf Python files
      run: python -m tox -e protoc
    - name: Build package
      run: python -m build
    - name: List artifacts
      run: ls ./dist
    - name: Install sigstore
      run: python -m pip install sigstore
    - name: Signing
      run: |
        for dist in dist/*; do
          dist_base="$(basename "${dist}")"
          echo "dist: ${dist}"
          echo "dist_base: ${dist_base}"
          python -m \
            sigstore sign "${dist}" \
            --output-signature "${dist_base}.sig" \
            --output-certificate "${dist_base}.crt" \
            --bundle "${dist_base}.sigstore"

          # Verify using `.sig` `.crt` pair;
          python -m \
            sigstore verify identity "${dist}" \
            --signature "${dist_base}.sig" \
            --cert "${dist_base}.crt" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --cert-identity ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/python-publish.yml@${GITHUB_REF}

          # Verify using `.sigstore` bundle;
          python -m \
            sigstore verify identity "${dist}" \
            --bundle "${dist_base}.sigstore" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --cert-identity ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/python-publish.yml@${GITHUB_REF}
        done
    - name: List artifacts after sign
      run: ls ./dist
    - name: Record artifact digests
      # Snapshot the digests of the signed, verified distributions so that any
      # substitution of dist/* by a later step can be detected.
      run: |
        sha256sum dist/* | tee dist.sha256
    - name: Copy files to release
      run: |
        gh release upload ${{ github.event.release.tag_name }} *.sigstore
        gh release upload ${{ github.event.release.tag_name }} *.sig
        gh release upload ${{ github.event.release.tag_name }} *.crt
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}
    - name: Verify artifact digests before publish
      # Fail the release before anything is uploaded if the signed
      # distributions no longer match what sigstore verified above.
      run: |
        sha256sum --check --strict dist.sha256
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Verify artifact digests after publish
      # Defence in depth: detect a third-party publish action that swapped a
      # distribution in the shared workspace before uploading it to PyPI.
      if: always()
      run: |
        sha256sum --check --strict dist.sha256
